<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h2>Login Successful!</h2>
        <p>Redirecting you back to the app...</p>
        <div class="spinner"></div>
    </div>

    <script>
        console.log("OAuth popup: Login successful for user {{USER_ID}}");
        
        const authResult = {
            success: true,
            user: {{{USER_JSON}}},
            isRegistrationComplete: {{IS_REGISTRATION_COMPLETE}},
           
        };
        const origin = '{{ORIGIN}}';
        
        console.log("OAuth popup: Sending auth result to main app:", authResult);
        console.log("OAuth popup: window.opener exists?", !!window.opener);
        
        if (window.opener) {
            try {
                setTimeout(() => {
                    console.log("OAuth popup: Attempting to send message to main app...");
                    
                    window.opener.postMessage({
                        type: 'GOOGLE_AUTH_SUCCESS',
                        result: authResult
                    }, origin);
                    
                    console.log("OAuth popup: Message sent successfully, closing popup in 5 seconds...");
                    
                    setTimeout(() => {
                        window.close();
                    }, 5000);
                    
                }, 1000);
                
            } catch (error) {
                console.error("OAuth popup: Failed to send message:", error);
                document.querySelector('.container').innerHTML = '<h2>❌ Authentication Error</h2><p>Please close this window and try again.</p>';
            }
        } else {
            console.error("OAuth popup: No opener window found");
            console.log("OAuth popup: This might be a direct navigation instead of popup");
            document.querySelector('.container').innerHTML = '<h2>❌ Popup Error</h2><p>Please close this window and try again.</p>';
        }
    </script>
</body>
</html>
