/api/auth/google:
  get:
    tags: [Authentication]
    summary: Initiates Google OAuth authentication
    description: |
      Redirects to Google OAuth login page. Supports both web and mobile platforms.
      - Web: Intended to be opened in a popup window; after authentication, returns HTML page that communicates with parent window via postMessage
      - Mobile: Direct redirect to app scheme URLs with authentication data in query parameters
    parameters:
      - in: query
        name: platform
        schema:
          type: string
          enum: [web, mobile]
          default: web
        description: |
          Platform type for authentication flow:
          - `web`: Returns HTML page with postMessage communication (designed for popup windows)
          - `mobile`: Redirects to app scheme with data in URL parameters
        example: mobile
      - in: query
        name: origin
        schema:
          type: string
        description: |
          (Web only) Origin URL of the main application window.
          Used for postMessage security and CORS validation.
          Should match the domain opening the popup window.
        example: "http://localhost:8081"
    responses:
      302:
        description: Redirects to Google OAuth authentication page
        headers:
          Location:
            schema:
              type: string
              example: "https://accounts.google.com/o/oauth2/v2/auth?client_id=...&state=web&redirect_uri=..."
      400:
        description: Invalid platform parameter
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "Invalid platform. Valid platforms are: web, mobile"

/api/auth/google/callback:
  get:
    tags: [Authentication]
    summary: Google OAuth callback endpoint
    description: |
      Handles the callback from Google OAuth. Behavior differs based on platform:
      
      **Web Platform (state=web):**
      - Sets HTTP-only JWT cookie for authentication
      - Returns 200 with HTML page containing authentication success UI
      - HTML page uses JavaScript postMessage to send auth data to parent window (React app)
      - Popup window automatically closes after sending data
      - Parent window receives auth result and handles navigation
      
      **Mobile Platform (state=mobile):**
      - Returns 302 redirects to app scheme URLs
      - Authentication data encoded in URL query parameters
      - No cookies (mobile apps handle token storage locally)
      
      This endpoint is automatically called by Google after successful OAuth authentication.
    parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Authorization code from Google (automatically provided by OAuth flow)
        example: "4/0AY0e-g7..."
      - in: query
        name: state
        schema:
          type: string
          enum: [web, mobile]
        description: |
          Platform identifier passed back from Google OAuth.
          Determines response format and behavior.
        example: "web"
      - in: query
        name: origin
        schema:
          type: string
        description: |
          (Web only) Origin URL of the parent window for postMessage security.
          Used to ensure messages are only sent to the correct origin.
        example: "http://localhost:8081"
    responses:
      200:
        description: Web platform authentication success page
        headers:
          Set-Cookie:
            schema:
              type: string
              example: "jwt=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Secure; SameSite=none; Max-Age=86400"
            description: JWT token cookie for web authentication
        content:
          text/html:
            schema:
              type: string
              description: |
                HTML page with authentication success UI and JavaScript postMessage functionality.
                The page includes:
                - Success confirmation UI with loading spinner
                - JavaScript that sends auth data to parent window via postMessage
                - Automatic popup closure after data transmission
                - Error handling for communication failures
              example: |
                HTML content includes JavaScript that posts message:
                ```javascript
                window.opener.postMessage({
                  type: 'GOOGLE_AUTH_SUCCESS',
                  result: {
                    success: true,
                    user: { _id: "...", firstName: "John", ... },
                    isRegistrationComplete: true
                  }
                }, origin);
                ```
      302:
        description: Mobile platform redirect with data in URL parameters
        headers:
          Location:
            schema:
              type: string
            description: App scheme URL with authentication data
            examples:
              mobileSuccess:
                value: "exp://localhost:19000/--/auth/result?token=eyJhbGciOiJIUzI1NiIs...&user=%7B%22_id%22%3A%22...%22%7D&isRegistrationComplete=true"
                summary: "Successful mobile authentication with encoded user data"
              mobileError:
                value: "exp://localhost:19000/--/auth/error?error=Authentication%20failed"
                summary: "Mobile authentication error"
        content:
          text/plain:
            schema:
              type: string
              description: |
                Mobile redirect URL structure:
                - `token`: JWT authentication token
                - `user`: URL-encoded JSON user object containing _id, firstName, lastName, email, role, isRegistrationComplete
                - `isRegistrationComplete`: Boolean indicating if user needs to complete registration
              example: |
                Success URL parameters:
                - token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                - user: "%7B%22_id%22%3A%22683ee3220b4859bd42d033d1%22%2C%22firstName%22%3A%22John%22%2C%22lastName%22%3A%22Doe%22%2C%22email%22%3A%22john%40example.com%22%2C%22role%22%3A%22Guest%22%2C%22isRegistrationComplete%22%3Atrue%7D"
                - isRegistrationComplete: "true"
                
                Error URL parameters:
                - error: "Authentication%20failed"
      401:
        description: Authentication failed (both platforms)
        content:
          text/html:
            schema:
              type: string
              description: |
                Web: HTML error page with postMessage to parent window
                Mobile: Redirect to error URL with error message
            examples:
              webError:
                value: |
                  HTML page that posts error message:
                  { type: 'GOOGLE_AUTH_ERROR', error: 'OAuth authentication failed' }
                summary: "Web platform error page with postMessage"
              mobileError:
                value: "exp://localhost:19000/--/auth/error?error=OAuth%20authentication%20failed"
                summary: "Mobile platform error redirect"

/api/auth/complete-registration:
  post:
    tags: [Authentication]
    summary: Complete user registration
    description: |
      Completes user registration by adding role-specific information. 
      Returns updated authentication token based on platform:
      
      **Web Platform:**
      - Sets new HTTP-only JWT cookie with updated user role
      - Cookie automatically replaces previous authentication cookie
      
      **Mobile Platform:**
      - Returns new JWT token in response body
      - Client should store token in secure storage
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: platform
        schema:
          type: string
          enum: [web, mobile]
        description: Platform type to determine token response format
        example: web
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/userDataForm'
    responses:
      200:
        description: Registration completed successfully
        headers:
          Set-Cookie:
            schema:
              type: string
              example: "jwt=eyJhbGciOiJIUzI1NiIs...; HttpOnly; Secure; SameSite=none; Max-Age=86400"
            description: |
              JWT token cookie (Web platform only).
              Contains updated user information including the newly assigned role.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: "User completed registration successfully"
                user:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: "683ee3220b4859bd42d033d1"
                    firstName:
                      type: string
                      example: "Test"
                    lastName:
                      type: string
                      example: "User"
                    email:
                      type: string
                      example: "test@example.com"
                    role:
                      type: string
                      enum: ["Guest", "Host"]
                      example: "Guest"
                    isRegistrationComplete:
                      type: boolean
                      example: true
                    phoneNumber:
                      type: string
                      example: "0529876543"
                    address:
                      type: string
                      example: "456 Guest Avenue, Host City"
                token:
                  type: string
                  description: |
                    JWT token with updated user role (Mobile platform only).
                    Client should store this token in secure storage.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      400:
        description: Invalid registration data or user already completed registration
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "User already completed profile"
                    status:
                      type: integer
                      example: 400
      401:
        description: Unauthorized - Invalid or missing token
      404:
        description: User not found
      500:
        description: Internal server error

/api/auth/logout:
  post:
    tags: [Authentication]
    summary: Logout user
    security:
      - cookieAuth: []
    responses:
      200:
        description: Successfully logged out
        content:
          application/json:
            schema:
              type: object
              properties:
                successStatus:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "Logged out successfully"
      401:
        description: Unauthorized - Invalid or missing token 